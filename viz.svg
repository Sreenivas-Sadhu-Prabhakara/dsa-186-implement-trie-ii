<text x="56.0" y="293.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">erase decrements the counters along the path — no node deletion needed; zero-count</text>
<text x="56.0" y="312.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">nodes are simply dead weight. Counters turn the trie from a set into a multiset.</text>
<text x="72.0" y="347.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">mutation</text>
