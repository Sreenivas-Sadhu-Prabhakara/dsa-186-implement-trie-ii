<text x="174.0" y="243.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">equalTo(apple) → 2</text>
<rect x="274.0" y="224.0" width="189.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="368.5" y="243.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">startsWith(app) → 3</text>
<line x1="24.0" y1="268.0" x2="736.0" y2="268.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="288.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
